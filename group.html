<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ikaze Group — Community Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-100 text-slate-900 h-screen flex flex-col overflow-hidden">

<div id="gate" class="flex-1 flex items-center justify-center text-center p-6">
  <div>
    <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-indigo-600 text-white font-extrabold flex items-center justify-center">IK</div>
    <p id="gateMsg" class="text-sm text-slate-600">Loading Ikaze Group…</p>
    <a id="gateBtn" href="index.html" class="hidden mt-3 inline-block px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Go to Home &amp; sign in</a>
  </div>
</div>

<div id="app" class="hidden flex-1 min-h-0 flex flex-col">
  <header class="h-14 bg-slate-900 text-white flex items-center gap-2 px-3 shrink-0">
    <a href="index.html" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold">← Home</a>
    <span class="font-bold hidden sm:inline">Ikaze Group</span>
    <nav class="flex gap-1 flex-1 overflow-x-auto text-xs font-semibold">
      <button data-act="go" data-id="groups" class="nv px-3 py-1.5 rounded-lg text-slate-300">Groups</button>
      <button data-act="go" data-id="members" class="nv px-3 py-1.5 rounded-lg text-slate-300">Members</button>
      <button data-act="go" data-id="dms" class="nv px-3 py-1.5 rounded-lg text-slate-300">Messages<span id="dmBadge" class="hidden ml-1 px-1.5 rounded-full bg-rose-500 text-white text-[10px]">0</span></button>
    </nav>
    <button data-act="newGroup" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-bold shrink-0">+ Group</button>
    <button id="meBtn" data-act="edit" title="My profile" class="shrink-0"></button>
  </header>

  <main class="flex-1 min-h-0 relative">
    <section id="v-groups" class="h-full overflow-y-auto p-4">
      <div class="max-w-6xl mx-auto">
        <div class="mb-4"><h1 class="text-xl font-extrabold">Ikaze Groups</h1><p class="text-xs text-slate-500">Every member can see all groups. Join one to open its chat.</p></div>
        <input id="gSearch" placeholder="Search groups…" class="w-full mb-4 px-3 py-2 rounded-xl border border-slate-200 text-sm">
        <div id="gGrid" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></div>
      </div>
    </section>

    <section id="v-chat" class="hidden h-full flex">
      <div class="flex-1 min-w-0 flex flex-col bg-white">
        <div class="px-4 py-3 border-b flex items-center gap-2">
          <button data-act="go" data-id="groups" class="text-sm font-semibold text-slate-500 px-1">←</button>
          <div class="min-w-0 flex-1"><h2 id="gTitle" class="font-bold text-sm truncate"></h2><p id="gSub" class="text-xs text-slate-500 truncate"></p></div>
          <button data-act="side" class="lg:hidden text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 font-semibold">Members</button>
        </div>
        <div id="gList" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50"></div>
        <form id="gForm" class="p-3 border-t flex gap-2">
          <textarea id="gInput" rows="1" placeholder="Message the group…" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-sm resize-none"></textarea>
          <button class="px-4 rounded-xl bg-indigo-600 text-white text-xs font-bold">Send</button>
        </form>
      </div>
      <aside id="gSide" class="hidden lg:flex flex-col w-72 bg-white border-l overflow-y-auto p-4 absolute lg:static inset-y-0 right-0 z-10 shadow-xl lg:shadow-none"></aside>
    </section>

    <section id="v-members" class="hidden h-full overflow-y-auto p-4">
      <div class="max-w-6xl mx-auto">
        <div class="mb-4"><h1 class="text-xl font-extrabold">Members</h1><p class="text-xs text-slate-500">View member info and start a private chat.</p></div>
        <input id="mSearch" placeholder="Search by name, role or specialization…" class="w-full mb-4 px-3 py-2 rounded-xl border border-slate-200 text-sm">
        <div id="mGrid" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></div>
      </div>
    </section>

    <section id="v-dms" class="hidden h-full flex">
      <div id="dmSide" class="w-full md:w-72 bg-white border-r overflow-y-auto shrink-0"></div>
      <div id="dmPane" class="hidden md:flex flex-1 min-w-0 flex-col bg-slate-50">
        <div id="dmHead" class="px-4 py-3 bg-white border-b flex items-center gap-2"></div>
        <div id="dList" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
        <form id="dForm" class="hidden p-3 bg-white border-t flex gap-2">
          <textarea id="dInput" rows="1" placeholder="Type a message…" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-sm resize-none"></textarea>
          <button class="px-4 rounded-xl bg-indigo-600 text-white text-xs font-bold">Send</button>
        </form>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="hidden fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
  <div id="modalBox" class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 shadow-2xl"></div>
</div>
<div id="toasts" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

<script type="module">
const CFG = {
  apiKey: "AIzaSyC8Jufh5-E714z6pEhAVfXU-IVKYJBAljE",
  authDomain: "ikaze-tech-connect.firebaseapp.com",
  projectId: "ikaze-tech-connect",
  storageBucket: "ikaze-tech-connect.firebasestorage.app",
  messagingSenderId: "22476064598",
  appId: "1:22476064598:web:44edeef1688e7d64a1b8f7",
  measurementId: "G-NECD5KHXWW"
};
const ROLES = ['IT Specialist','Software Developer','Web Developer','Mobile App Developer','Computer Science Student','ICT Professional','Digital Educator','Robotics Engineer','Automation Specialist','Artificial Intelligence Specialist','Cybersecurity Specialist','Network Engineer','Data Scientist / Data Analyst','UI/UX Designer','Digital Entrepreneur','Technology Researcher','Digital Innovator','Other'];
const CATS = ['Technology','Design & Creative','Business & Startups','Community & Events','Education & Study'];
const IN = 'w-full px-3 py-2 rounded-xl border border-slate-200 text-sm';
const BTN = 'px-4 py-2 rounded-xl text-xs font-bold';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
let A, Au, F;
try {
  [A, Au, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
} catch (e) { $('gateMsg').textContent = 'Could not load Firebase. Check your connection and reload.'; throw e; }

const app = A.initializeApp(CFG), auth = Au.getAuth(app);
let db;
try { db = F.initializeFirestore(app, { experimentalAutoDetectLongPolling: true }); } catch (e) { db = F.getFirestore(app); }
await Au.setPersistence(auth, Au.browserLocalPersistence).catch(() => {});
const { doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, onSnapshot, query, where, orderBy, limit, arrayUnion, arrayRemove } = F;

let me = null, users = {}, groups = [], dms = [], gmsgs = [], view = 'groups', gid = null, dmWith = null, unsubG = null, pPhoto = '', pend = null, dmFirst = true;

/* ---------- helpers ---------- */
const COLORS = ['#4a7aff','#b07aff','#00a6d6','#ff6b9d','#e69a1c','#2bb67d','#ff7a45','#6c7cff'];
const col = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const safe = p => /^(data:image\/(png|jpe?g|webp|gif);base64,|https:\/\/)/.test(p || '') ? p : '';
const U = id => users[id] || { uid: id, name: 'Former member' };
const online = u => !!(u && u.online && Date.now() - (u.lastSeen || 0) < 150000);
const cid = (a, b) => [a, b].sort().join('__');
const time = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const av = (u, sz = 'w-9 h-9') => {
  u = u || { name: '?' };
  const p = safe(u.photo);
  return p ? `<img src="${esc(p)}" alt="" class="${sz} rounded-full object-cover shrink-0">`
    : `<span class="${sz} rounded-full shrink-0 inline-flex items-center justify-center text-white text-xs font-bold" style="background:${col(u.uid || u.name)}">${esc((u.name || '?').trim().charAt(0).toUpperCase() || '?')}</span>`;
};
function toast(m) { const t = document.createElement('div'); t.className = 'px-3 py-2 rounded-xl bg-slate-900 text-white text-xs shadow-lg'; t.textContent = m; $('toasts').appendChild(t); setTimeout(() => t.remove(), 3500); }
const err = e => { console.warn(e); toast(e && e.code === 'permission-denied' ? 'Permission denied — publish firestore.rules in Firebase.' : 'Something went wrong. Please try again.'); };
const modal = h => { $('modalBox').innerHTML = h; $('modal').classList.remove('hidden'); };
const closeModal = () => $('modal').classList.add('hidden');
function setList(el, h) { const near = el.scrollHeight - el.scrollTop - el.clientHeight < 100; el.innerHTML = h; if (near) el.scrollTop = el.scrollHeight; }
const rd = () => { try { return JSON.parse(localStorage.getItem('ikzg_read_' + me.uid)) || {}; } catch (e) { return {}; } };
const unread = () => { const r = rd(); return dms.filter(m => m.senderId !== me.uid && m.createdAt > (r[m.chatId] || 0)); };
function markRead() { if (!dmWith) return; const r = rd(); r[cid(me.uid, dmWith)] = Date.now(); try { localStorage.setItem('ikzg_read_' + me.uid, JSON.stringify(r)); } catch (e) {} }

/* ---------- navigation & render ---------- */
function go(v) {
  view = v;
  ['groups', 'chat', 'members', 'dms'].forEach(k => $('v-' + k).classList.toggle('hidden', k !== v));
  document.querySelectorAll('.nv').forEach(b => {
    const a = b.dataset.id === v || (v === 'chat' && b.dataset.id === 'groups');
    b.classList.toggle('bg-indigo-600', a); b.classList.toggle('text-white', a); b.classList.toggle('text-slate-300', !a);
  });
  render();
}
function render() {
  if (!me) return;
  $('meBtn').innerHTML = av(me, 'w-8 h-8');
  if (view === 'dms' && dmWith) markRead();
  const n = unread().length, b = $('dmBadge'); b.textContent = n; b.classList.toggle('hidden', !n);
  ({ groups: renderGroups, chat: renderChat, members: renderMembers, dms: renderDms })[view]();
}

function renderGroups() {
  const t = $('gSearch').value.toLowerCase();
  const list = groups.filter(g => !t || ((g.name || '') + ' ' + (g.description || '') + ' ' + (g.category || '')).toLowerCase().includes(t));
  $('gGrid').innerHTML = list.map(g => {
    const mem = g.members || [], j = mem.includes(me.uid);
    return `<div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-2">
      <div class="flex justify-between items-center"><span class="text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-semibold">${esc(g.category)}</span>${j ? '<span class="text-[11px] text-emerald-600 font-bold">Joined</span>' : ''}</div>
      <h3 class="font-bold">${esc(g.name)}</h3>
      <p class="text-xs text-slate-600 flex-1 line-clamp-3">${esc(g.description)}</p>
      <p class="text-[11px] text-slate-400">${mem.length} member${mem.length === 1 ? '' : 's'} · by ${esc(U(g.creatorId).name || g.creatorName)}</p>
      <button data-act="open" data-id="${esc(g.id)}" class="py-2 rounded-xl ${j ? 'bg-indigo-600' : 'bg-slate-900'} text-white text-xs font-bold">${j ? 'Open group chat' : 'Join &amp; open'}</button></div>`;
  }).join('') || '<p class="text-sm text-slate-500">No groups yet — tap “+ Group” to create the first one.</p>';
}

function renderChat() {
  const g = groups.find(x => x.id === gid); if (!g) return;
  const mem = g.members || [], mine = g.creatorId === me.uid;
  $('gTitle').textContent = g.name; $('gSub').textContent = `${g.category} · ${mem.length} members`;
  let h = '', last = '';
  gmsgs.forEach(m => {
    const own = m.senderId === me.uid, u = U(m.senderId), d = new Date(m.createdAt).toDateString();
    if (d !== last) { last = d; h += `<div class="text-center text-[11px] text-slate-400">${esc(d)}</div>`; }
    h += `<div class="flex gap-2 ${own ? 'flex-row-reverse' : ''}">${own ? '' : `<button data-act="view" data-id="${esc(m.senderId)}">${av(u, 'w-8 h-8')}</button>`}
      <div class="max-w-[75%]">${own ? '' : `<p class="text-[11px] font-semibold text-slate-500">${esc(u.name || m.senderName)}</p>`}
      <div class="px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap break-words ${own ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200'}">${esc(m.text)}</div>
      <p class="text-[10px] text-slate-400 ${own ? 'text-right' : ''}">${time(m.createdAt)}${own || mine ? ` · <button data-act="delMsg" data-id="${esc(m.id)}" class="hover:text-rose-500">delete</button>` : ''}</p></div></div>`;
  });
  setList($('gList'), h || '<p class="text-center text-sm text-slate-400 mt-10">No messages yet — say hello 👋</p>');
  $('gSide').innerHTML = `<h4 class="text-[11px] font-bold uppercase text-slate-400 mb-1">About</h4><p class="text-xs text-slate-700 mb-4">${esc(g.description)}</p>
    <h4 class="text-[11px] font-bold uppercase text-slate-400 mb-1">Members (${mem.length})</h4>
    <div class="space-y-1">${mem.map(id => { const u = U(id); return `<button data-act="view" data-id="${esc(id)}" class="w-full flex items-center gap-2 p-2 rounded-xl hover:bg-slate-50 text-left">${av(u, 'w-8 h-8')}<span class="min-w-0"><span class="block text-xs font-semibold truncate">${esc(u.name)}${id === g.creatorId ? ' ⭐' : ''}</span><span class="block text-[11px] text-slate-400 truncate">${esc(u.profession || 'Member')}</span></span></button>`; }).join('')}</div>
    ${mine ? `<button data-act="delGroup" class="mt-4 w-full py-2 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold border border-rose-200">Delete group</button>`
           : `<button data-act="leave" class="mt-4 w-full py-2 rounded-xl border border-rose-200 text-rose-600 text-xs font-semibold">Leave group</button>`}`;
}

function renderMembers() {
  const t = $('mSearch').value.toLowerCase();
  const l = Object.values(users).filter(u => !t || [u.name, u.profession, u.specializations].join(' ').toLowerCase().includes(t))
    .sort((a, b) => (online(b) - online(a)) || (a.name || '').localeCompare(b.name || ''));
  $('mGrid').innerHTML = l.map(u => `<div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col gap-2">
    <div class="flex items-center gap-3">${av(u, 'w-11 h-11')}<div class="min-w-0"><p class="font-semibold text-sm truncate">${esc(u.name)}${u.uid === me.uid ? ' (you)' : ''}</p><p class="text-xs text-slate-500 truncate">${esc(u.profession || 'Member')}</p></div><span class="ml-auto w-2.5 h-2.5 rounded-full ${online(u) ? 'bg-emerald-500' : 'bg-slate-300'}"></span></div>
    <p class="text-xs text-slate-600 line-clamp-2">${esc(u.notes || '')}</p>
    <div class="flex gap-2 mt-auto"><button data-act="view" data-id="${esc(u.uid)}" class="flex-1 py-1.5 rounded-lg bg-slate-100 text-xs font-semibold">View info</button>${u.uid === me.uid ? '' : `<button data-act="dm" data-id="${esc(u.uid)}" class="flex-1 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">Message</button>`}</div></div>`).join('');
}

function renderDms() {
  const r = rd(), seen = {};
  [...dms].reverse().forEach(m => { if (!seen[m.chatId]) seen[m.chatId] = m; });
  const items = Object.values(seen).map(m => ({ o: (m.members || []).find(i => i !== me.uid), m })).filter(x => x.o);
  $('dmSide').innerHTML = '<div class="p-3 text-[11px] font-bold uppercase text-slate-400">Conversations</div>' + (items.map(({ o, m }) => {
    const u = U(o), n = dms.filter(x => x.chatId === m.chatId && x.senderId !== me.uid && x.createdAt > (r[m.chatId] || 0)).length;
    return `<button data-act="dm" data-id="${esc(o)}" class="w-full flex items-center gap-2 px-3 py-2.5 text-left hover:bg-slate-50 ${o === dmWith ? 'bg-indigo-50' : ''}">${av(u)}<span class="min-w-0 flex-1"><span class="block text-sm font-semibold truncate">${esc(u.name)}</span><span class="block text-xs text-slate-500 truncate">${esc(m.text)}</span></span>${n ? `<span class="px-1.5 rounded-full bg-rose-500 text-white text-[10px]">${n}</span>` : ''}</button>`;
  }).join('') || '<p class="px-3 text-xs text-slate-400">No chats yet. Open <b>Members</b> and tap Message.</p>');
  $('dmPane').className = 'flex-1 min-w-0 flex-col bg-slate-50 ' + (dmWith ? 'flex' : 'hidden md:flex');
  $('dmSide').className = 'w-full md:w-72 bg-white border-r overflow-y-auto shrink-0 ' + (dmWith ? 'hidden md:block' : '');
  $('dForm').classList.toggle('hidden', !dmWith);
  if (!dmWith) { $('dmHead').innerHTML = ''; $('dList').innerHTML = '<p class="text-center text-sm text-slate-400 mt-10">Select a conversation or message a member.</p>'; return; }
  const u = U(dmWith), c = cid(me.uid, dmWith);
  $('dmHead').innerHTML = `<button data-act="dmBack" class="md:hidden text-sm font-semibold text-slate-500 px-1">←</button>${av(u)}<div class="min-w-0 flex-1"><p class="text-sm font-bold truncate">${esc(u.name)}</p><p class="text-xs text-slate-500 truncate">${online(u) ? 'Online' : 'Offline'} · ${esc(u.profession || 'Member')}</p></div><button data-act="view" data-id="${esc(dmWith)}" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-100 font-semibold">Info</button>`;
  setList($('dList'), dms.filter(m => m.chatId === c).map(m => {
    const own = m.senderId === me.uid;
    return `<div class="flex ${own ? 'justify-end' : ''}"><div class="max-w-[75%]"><div class="px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap break-words ${own ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200'}">${esc(m.text)}</div><p class="text-[10px] text-slate-400 ${own ? 'text-right' : ''}">${time(m.createdAt)}${own ? ` · <button data-act="delDm" data-id="${esc(m.id)}" class="hover:text-rose-500">delete</button>` : ''}</p></div></div>`;
  }).join('') || '<p class="text-center text-sm text-slate-400 mt-10">Say hello 👋</p>');
}

/* ---------- groups ---------- */
async function openGroup(id) {
  const g = groups.find(x => x.id === id);
  if (g && !(g.members || []).includes(me.uid)) {
    try { await updateDoc(doc(db, 'groups', id), { members: arrayUnion(me.uid) }); toast('Joined ' + g.name); } catch (e) { return err(e); }
  }
  gid = id; gmsgs = []; if (unsubG) unsubG();
  unsubG = onSnapshot(query(collection(db, 'groups', id, 'messages'), orderBy('createdAt', 'desc'), limit(200)),
    s => { gmsgs = s.docs.map(d => ({ id: d.id, ...d.data() })).reverse(); if (view === 'chat') renderChat(); }, err);
  go('chat');
}
function newGroup() {
  modal(`<h3 class="font-bold mb-3">Create a group</h3><div class="space-y-3">
    <input id="nName" maxlength="60" placeholder="Group name" class="${IN}">
    <select id="nCat" class="${IN}">${CATS.map(c => `<option>${esc(c)}</option>`).join('')}</select>
    <textarea id="nDesc" rows="3" maxlength="300" placeholder="What is this group about?" class="${IN}"></textarea>
    <div class="flex justify-end gap-2"><button data-act="close" class="${BTN} border border-slate-200">Cancel</button><button data-act="saveGroup" class="${BTN} bg-indigo-600 text-white">Create &amp; open</button></div></div>`);
}
async function saveGroup() {
  const name = $('nName').value.trim(), description = $('nDesc').value.trim();
  if (!name || !description) return toast('Add a name and a description.');
  try {
    const r = await addDoc(collection(db, 'groups'), { name, category: $('nCat').value, description, creatorId: me.uid, creatorName: me.name, members: [me.uid], createdAt: Date.now() });
    closeModal(); toast('Group created.'); openGroup(r.id);
  } catch (e) { err(e); }
}

/* ---------- member info & profile ---------- */
function viewMember(id) {
  const u = U(id), sh = groups.filter(g => (g.members || []).includes(id) && (g.members || []).includes(me.uid)).map(g => esc(g.name)).join(', ');
  const row = (l, h) => `<div><p class="text-[11px] font-bold uppercase text-slate-400">${l}</p><p class="text-sm text-slate-700 whitespace-pre-wrap break-words">${h || '—'}</p></div>`;
  modal(`<div class="flex items-center gap-3 mb-4">${av(u, 'w-16 h-16')}<div class="min-w-0"><h3 class="font-bold truncate">${esc(u.name)}</h3><p class="text-xs text-slate-500">${esc(u.profession || 'Member')} · ${online(u) ? 'Online' : 'Offline'}</p></div></div>
    <div class="space-y-3">${row('Specializations', esc(u.specializations))}${row('About', esc(u.notes))}${row('Email', esc(u.email))}${row('Groups in common', sh)}</div>
    <div class="flex justify-end gap-2 mt-5"><button data-act="close" class="${BTN} border border-slate-200">Close</button>${id === me.uid ? `<button data-act="edit" class="${BTN} bg-indigo-600 text-white">Edit my profile</button>` : `<button data-act="dm" data-id="${esc(id)}" class="${BTN} bg-indigo-600 text-white">Message</button>`}</div>`);
}
function editProfile(first) {
  const cur = me.profession || '', custom = cur && !ROLES.includes(cur); pPhoto = me.photo || '';
  modal(`<h3 class="font-bold mb-1">${first === true ? 'Complete your profile' : 'Edit my profile'}</h3><p class="text-xs text-slate-500 mb-3">Other members can view this info but cannot change it.</p>
    <div class="space-y-3">
      <div class="flex items-center gap-3"><span id="pAv">${av({ ...me, photo: pPhoto }, 'w-16 h-16')}</span><button data-act="photo" class="${BTN} bg-slate-100">Upload photo</button><button data-act="rmPhoto" class="${BTN} text-rose-600">Remove</button></div>
      <input id="pName" maxlength="60" value="${esc(me.name)}" placeholder="Full name" class="${IN}">
      <select id="pRole" class="${IN}"><option value="">Select your primary role</option>${ROLES.map(r => `<option ${(custom ? 'Other' : cur) === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>
      <input id="pOther" value="${custom ? esc(cur) : ''}" placeholder="Your role" class="${IN} ${custom || cur === 'Other' ? '' : 'hidden'}">
      <input id="pSpec" maxlength="120" value="${esc(me.specializations)}" placeholder="Areas of specialization" class="${IN}">
      <textarea id="pNotes" rows="3" maxlength="500" placeholder="Profile notes visible to members" class="${IN}">${esc(me.notes)}</textarea>
      <div class="flex justify-between gap-2"><button data-act="signout" class="${BTN} text-slate-500">Sign out</button><span><button data-act="close" class="${BTN} border border-slate-200">Cancel</button> <button data-act="saveProfile" class="${BTN} bg-indigo-600 text-white">Save</button></span></div>
    </div>`);
}
function pickPhoto() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    if (f.size > 8e6) return toast('Image too large (max 8 MB).');
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 320 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        pPhoto = c.toDataURL('image/jpeg', .85); $('pAv').innerHTML = av({ ...me, photo: pPhoto }, 'w-16 h-16');
      };
      im.onerror = () => toast('Could not read that image.'); im.src = r.result;
    };
    r.readAsDataURL(f);
  };
  i.click();
}
async function saveProfile() {
  const name = $('pName').value.trim(); if (!name) return toast('Name cannot be empty.');
  const sel = $('pRole').value, role = sel === 'Other' ? ($('pOther').value.trim() || 'Other') : sel;
  const patch = { name, profession: role, specializations: $('pSpec').value.trim(), notes: $('pNotes').value.trim(), photo: pPhoto, onboarded: true };
  try { await setDoc(doc(db, 'users', me.uid), patch, { merge: true }); me = { ...me, ...patch }; closeModal(); render(); toast('Profile saved.'); } catch (e) { err(e); }
}
async function signout() {
  try { await setDoc(doc(db, 'users', me.uid), { online: false, lastSeen: Date.now() }, { merge: true }); } catch (e) {}
  await Au.signOut(auth);
  ['ikaze_session_uid', 'ikz_profile', 'ikaze_profile'].forEach(k => localStorage.removeItem(k));
  location.href = 'index.html';
}
function openDm(id) {
  if (!id || id === me.uid) return;
  if (!users[id]) return toast('Member not found.');
  dmWith = id; closeModal(); go('dms');
}

/* ---------- actions ---------- */
const acts = {
  go, open: openGroup, view: viewMember, dm: openDm, edit: editProfile, newGroup, saveGroup, saveProfile, signout,
  close: closeModal, photo: pickPhoto,
  rmPhoto: () => { pPhoto = ''; $('pAv').innerHTML = av({ ...me, photo: '' }, 'w-16 h-16'); },
  side: () => $('gSide').classList.toggle('hidden'),
  dmBack: () => { dmWith = null; render(); },
  delMsg: id => deleteDoc(doc(db, 'groups', gid, 'messages', id)).catch(err),
  delDm: id => deleteDoc(doc(db, 'messages', id)).catch(err),
  leave: async () => {
    try { if (unsubG) unsubG(); await updateDoc(doc(db, 'groups', gid), { members: arrayRemove(me.uid) }); gid = null; go('groups'); toast('You left the group.'); } catch (e) { err(e); }
  },
  delGroup: async () => {
    if (!confirm('Delete this group for everyone?')) return;
    try { if (unsubG) unsubG(); await deleteDoc(doc(db, 'groups', gid)); gid = null; go('groups'); toast('Group deleted.'); } catch (e) { err(e); }
  }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && acts[b.dataset.act]) acts[b.dataset.act](b.dataset.id, b); });
document.addEventListener('input', e => { if (e.target.id === 'gSearch' || e.target.id === 'mSearch') render(); });
document.addEventListener('change', e => { if (e.target.id === 'pRole') $('pOther').classList.toggle('hidden', e.target.value !== 'Other'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

function wireComposer(formId, inputId, send) {
  $(formId).addEventListener('submit', async e => {
    e.preventDefault(); const t = $(inputId).value.trim(); if (!t) return;
    $(inputId).value = '';
    try { await send(t); } catch (x) { $(inputId).value = t; err(x); }
  });
  $(inputId).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $(formId).requestSubmit(); } });
}
wireComposer('gForm', 'gInput', t => gid && addDoc(collection(db, 'groups', gid, 'messages'), { senderId: me.uid, senderName: me.name, text: t, createdAt: Date.now() }));
wireComposer('dForm', 'dInput', t => dmWith && addDoc(collection(db, 'messages'), { chatId: cid(me.uid, dmWith), members: [me.uid, dmWith], senderId: me.uid, senderName: me.name, text: t, createdAt: Date.now(), edited: false }));

/* ---------- auth & live data ---------- */
Au.onAuthStateChanged(auth, async u => {
  if (!u) {
    me = null; $('app').classList.add('hidden'); $('gate').classList.remove('hidden');
    $('gateMsg').textContent = 'Please sign in on the home page first.'; $('gateBtn').classList.remove('hidden');
    setTimeout(() => { if (!auth.currentUser) location.href = 'index.html'; }, 2500);
    return;
  }
  if (me && me.uid === u.uid) return;
  const ref = doc(db, 'users', u.uid);
  let p = { uid: u.uid, name: u.displayName || (u.email || '').split('@')[0] || 'Member', email: u.email || '', photo: u.photoURL || '', profession: '', specializations: '', notes: '', online: true, onboarded: false, lastSeen: Date.now(), createdAt: Date.now() };
  try { const s = await getDoc(ref); if (s.exists()) p = { ...p, ...s.data(), uid: u.uid }; else await setDoc(ref, p); } catch (e) { err(e); }
  me = p; $('gate').classList.add('hidden'); $('app').classList.remove('hidden');

  const beat = () => setDoc(ref, { online: true, lastSeen: Date.now() }, { merge: true }).catch(() => {});
  beat(); setInterval(beat, 60000);
  addEventListener('beforeunload', () => { setDoc(ref, { online: false, lastSeen: Date.now() }, { merge: true }); });

  const q = new URLSearchParams(location.search); pend = { g: q.get('group'), d: q.get('dm') };
  onSnapshot(collection(db, 'users'), s => {
    users = {}; s.forEach(d => { users[d.id] = { uid: d.id, ...d.data() }; });
    if (users[me.uid]) me = { ...me, ...users[me.uid] };
    if (pend && pend.d && users[pend.d]) { const d = pend.d; pend.d = null; openDm(d); } else render();
  }, err);
  onSnapshot(collection(db, 'groups'), s => {
    groups = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    if (pend && pend.g && groups.some(g => g.id === pend.g)) { const g = pend.g; pend.g = null; openGroup(g); return; }
    if (view === 'chat' && gid && !groups.some(g => g.id === gid)) { if (unsubG) unsubG(); gid = null; toast('This group no longer exists.'); go('groups'); return; }
    render();
  }, err);
  onSnapshot(query(collection(db, 'messages'), where('members', 'array-contains', me.uid)), s => {
    dms = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (!dmFirst) s.docChanges().forEach(c => {
      const m = c.doc.data();
      if (c.type === 'added' && m.senderId !== me.uid && !(view === 'dms' && dmWith === m.senderId)) toast('New message from ' + (U(m.senderId).name || m.senderName));
    });
    dmFirst = false; render();
  }, err);

  go('groups');
  if (!p.onboarded) editProfile(true);
});
</script>
</body>
</html>
